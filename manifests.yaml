apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollouts-demo
  namespace: demo-qa
spec:
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
      - image: argoproj/rollouts-demo:blue
        imagePullPolicy: IfNotPresent
        name: rollouts-demo
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo
  namespace: demo-qa
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: rollouts-demo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rollouts-demo
  namespace: demo-qa
spec:
  ingressClassName: nginx
  rules:
  - host: demo-qa.localhost
    http:
      paths:
      - backend:
          service:
            name: rollouts-demo
            port:
              number: 80
        path: /
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: demo-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
    spec:
      containers:
      - args:
        - |
          while true; do
            curl -s -o /dev/null --max-time 5 -X POST -H "Host: ${NAMESPACE}.localhost" \
              http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/color
            sleep 0.2
          done
        command:
        - sh
        - -c
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/curl/curl:8.11.1
        name: traffic
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
