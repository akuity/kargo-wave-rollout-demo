apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollouts-demo
  namespace: demo-prod-wave2-a
spec:
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
      - image: argoproj/rollouts-demo:purple
        imagePullPolicy: IfNotPresent
        name: rollouts-demo
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
      - envFrom:
        - configMapRef:
            name: feature-flags-5886tgcdf8
        image: nginx:1.27.3-alpine
        imagePullPolicy: IfNotPresent
        name: flags
        ports:
        - containerPort: 8081
        readinessProbe:
          tcpSocket:
            port: 8081
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        volumeMounts:
        - mountPath: /etc/nginx/templates
          name: flags-proxy
      volumes:
      - configMap:
          name: flags-proxy-k6mf2m226m
        name: flags-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo
  namespace: demo-prod-wave2-a
spec:
  ports:
  - port: 80
    targetPort: 8081
  selector:
    app: rollouts-demo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rollouts-demo
  namespace: demo-prod-wave2-a
spec:
  ingressClassName: nginx
  rules:
  - host: demo-prod-wave2-a.localhost
    http:
      paths:
      - backend:
          service:
            name: rollouts-demo
            port:
              number: 80
        path: /
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: demo-prod-wave2-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
    spec:
      containers:
      - args:
        - |
          while true; do
            curl -s -o /dev/null --max-time 5 -X POST -H "Host: ${NAMESPACE}.localhost" \
              http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/color
            sleep 0.2
          done
        command:
        - sh
        - -c
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/curl/curl:8.11.1
        name: traffic
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
---
apiVersion: v1
data:
  CHECKOUT_V2: "off"
  DARK_MODE: "off"
kind: ConfigMap
metadata:
  name: feature-flags-5886tgcdf8
  namespace: demo-prod-wave2-a
---
apiVersion: v1
data:
  default.conf.template: |
    # Sidecar in front of rollouts-demo that applies the feature flags. The nginx image runs
    # envsubst on this file at start, filling ${CHECKOUT_V2} and ${DARK_MODE} from the
    # feature-flags ConfigMap; nginx's own $variables are left alone.

    # CHECKOUT_V2=on sends ~30% of requests down the broken checkout path.
    split_clients "$request_id" $checkout_v2_path {
        30%  broken;
        *    ok;
    }
    map "${CHECKOUT_V2}:$checkout_v2_path" $checkout_v2_fails {
        "on:broken"  1;
        default      0;
    }

    server {
        listen 8081;
        location / {
            add_header X-Feature-Checkout-V2 "${CHECKOUT_V2}" always;
            add_header X-Feature-Dark-Mode "${DARK_MODE}" always;
            if ($checkout_v2_fails) {
                return 500 "checkout_v2 failed\n";
            }
            proxy_pass http://127.0.0.1:8080;
        }
    }
kind: ConfigMap
metadata:
  name: flags-proxy-k6mf2m226m
  namespace: demo-prod-wave2-a
