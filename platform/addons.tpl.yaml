# Cluster add-ons the demo needs: an ingress controller whose request metrics the
# verification reads, and a Prometheus to scrape them. In a real environment these
# already exist (and the metrics backend may be Coralogix, Datadog, ...).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${CLUSTER}-ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          service:
            type: ClusterIP
          admissionWebhooks:
            enabled: false
          metrics:
            enabled: true
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "10254"
  destination:
    name: ${CLUSTER}
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${CLUSTER}-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.38.2
    helm:
      releaseName: prometheus
      valuesObject:
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          persistentVolume:
            enabled: false
          global:
            scrape_interval: 10s
            evaluation_interval: 10s
  destination:
    name: ${CLUSTER}
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
