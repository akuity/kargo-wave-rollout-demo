# One Stage per environment / cluster. Each Stage is just: where its Freight comes from,
# whether it verifies, and the shared `deploy` task.
#
#   dev -> qa -> prod-wave1 -> prod-wave2-{a,b,c} -> prod-wave3-{a..e}
#
# Promotion policy (auto-promotion, autoRollback) lives in project.yaml.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: ${PROJECT}
  annotations:
    kargo.akuity.io/color: gray
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: qa
  namespace: ${PROJECT}
  annotations:
    kargo.akuity.io/color: amber
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy
# Wave 1: one canary cluster. QA promotes it by hand.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-wave1
  namespace: ${PROJECT}
  annotations:
    kargo.akuity.io/color: orange
  labels:
    wave: "1"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - qa
  verification:
    analysisTemplates:
    - name: error-rate
    - name: latency-p95
    args:
    - name: stage
      value: prod-wave1
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy
# Wave 2: starts as soon as the canary has verified the Freight.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
