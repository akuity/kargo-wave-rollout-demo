  labels:
    wave: "2"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - prod-wave1
  verification:
    analysisTemplates:
    - name: error-rate
    - name: latency-p95
    args:
    - name: stage
      value: prod-wave2-a
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy
---
