          name: deploy
# Wave 3: starts only when every wave 2 Stage has verified the Freight.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-wave3-a
  namespace: ${PROJECT}
  annotations:
    kargo.akuity.io/color: blue
  labels:
    wave: "3"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - prod-wave2-a
      - prod-wave2-b
      - prod-wave2-c
      availabilityStrategy: All
  verification:
