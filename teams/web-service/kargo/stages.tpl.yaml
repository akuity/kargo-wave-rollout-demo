# One Stage per environment / cluster. Each Stage is just: where its Freight comes from,
# whether it verifies, and the platform's deploy-k8s task with this service's settings.
#
#   dev -> qa -> prod-wave1 -> prod-wave2-{a,b,c} -> prod-wave3-{a..e}
#   (waves 2 and 3 follow their upstream Stage, forward and back)
#
# Promotion policy (auto-promotion, autoRollback) lives in project.yaml; who may promote
# lives in roles.yaml.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: ${WEB_PROJECT}
  annotations:
    kargo.akuity.io/color: gray
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy-k8s
          kind: ClusterPromotionTask
        vars:
        - name: repoURL
          value: ${GIT_REPO}
        - name: image
          value: argoproj/rollouts-demo
        - name: overlays
          value: teams/web-service/app/overlays
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: qa
  namespace: ${WEB_PROJECT}
  annotations:
    kargo.akuity.io/color: amber
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy-k8s
          kind: ClusterPromotionTask
        vars:
        - name: repoURL
          value: ${GIT_REPO}
        - name: image
          value: argoproj/rollouts-demo
        - name: overlays
          value: teams/web-service/app/overlays
---
# Wave 1: one canary cluster. QA promotes it by hand, and the deploy waits for an approved
# PR (see the approval var below), which gates the whole wave rollout.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-wave1
  namespace: ${WEB_PROJECT}
  annotations:
    kargo.akuity.io/color: orange
  labels:
    wave: "1"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - qa
  verification:
    analysisTemplates:
    - name: ingress-error-rate
      kind: ClusterAnalysisTemplate
    - name: ingress-latency-p95
      kind: ClusterAnalysisTemplate
    args:
    - name: host
      value: demo-prod-wave1.localhost
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy-k8s
          kind: ClusterPromotionTask
        vars:
        - name: repoURL
          value: ${GIT_REPO}
        - name: image
          value: argoproj/rollouts-demo
        - name: overlays
          value: teams/web-service/app/overlays
        # Change control: every deploy to the canary (and so to all of prod, which follows it)
        # waits for an approved, merged PR into rendered/prod-wave1.
        - name: approval
          value: pr
---
# Wave 2: tracks the canary. MatchUpstream means each wave 2 Stage runs whatever prod-wave1
# runs now (once verified there), so a rollback of prod-wave1 rolls back wave 2 as well.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-wave2-a
  namespace: ${WEB_PROJECT}
  annotations:
    kargo.akuity.io/color: violet
  labels:
    wave: "2"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - prod-wave1
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  verification:
    analysisTemplates:
    - name: ingress-error-rate
      kind: ClusterAnalysisTemplate
    - name: ingress-latency-p95
      kind: ClusterAnalysisTemplate
    args:
    - name: host
      value: demo-prod-wave2-a.localhost
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy-k8s
          kind: ClusterPromotionTask
        vars:
        - name: repoURL
          value: ${GIT_REPO}
        - name: image
          value: argoproj/rollouts-demo
        - name: overlays
          value: teams/web-service/app/overlays
