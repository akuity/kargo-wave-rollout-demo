apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollouts-demo
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
      - name: rollouts-demo
        # The tag is set per overlay; Kargo replaces it with the Freight's tag at promotion.
        # bad-* tags return a share of 500s, slow-* tags add latency.
        image: argoproj/rollouts-demo:blue
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
      # Applies the feature flags (flags.env) to live traffic. The Service points here.
      - name: flags
        image: nginx:1.27.3-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: feature-flags
        ports:
        - containerPort: 8081
        readinessProbe:
          tcpSocket:
            port: 8081
        volumeMounts:
        - name: flags-proxy
          mountPath: /etc/nginx/templates
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
      volumes:
      - name: flags-proxy
        configMap:
          name: flags-proxy
