apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod-wave3-b
resources:
- ../../base
images:
- name: argoproj/rollouts-demo
  newTag: blue
patches:
- target:
    kind: Ingress
    name: rollouts-demo
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: demo-prod-wave3-b.localhost
